[project]
name = "neurosentinel"
version = "0.5.0"
description = "Autonomous multimodal AI intelligence and prediction platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.5",
  "numpy==2.2.1",
  "pandas==2.2.3",
  "scikit-learn==1.6.1",
  "joblib==1.4.2",
  "pillow==11.1.0",
  "python-multipart==0.0.20",
]

[project.scripts]
neurosentinel = "app.cli:main"
