[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosentinel"
version = "0.2.0"
description = "Multimodal ML/DL intelligence and prediction platform"
requires-python = ">=3.11"

[project.scripts]
neurosentinel = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
